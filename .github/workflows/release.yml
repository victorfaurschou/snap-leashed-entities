name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: victorfaurschou/minecraft-modding-workflows/.github/workflows/build.yml@main
    secrets: inherit

  release:
    needs: build
    permissions:
      contents: write
      actions: read
    uses: victorfaurschou/minecraft-modding-workflows/.github/workflows/release.yml@main
    with:
      mod_name: snap-leashed-entities
      build_run_id: ${{ github.run_id }}
      build_sha: ${{ github.sha }}
      build_branch: ${{ github.ref_name }}
      build_event: ${{ github.event_name }}
      modrinth_loaders: fabric
      modrinth_environment: server_only
      modrinth_dependencies: '[{"project_id":"P7dR8mSH","dependency_type":"required"}]'
      curseforge_loaders: fabric
      curseforge_relations: '[{"slug":"fabric-api","type":"requiredDependency"}]'
      curseforge_java_versions: "25"
    secrets: inherit
